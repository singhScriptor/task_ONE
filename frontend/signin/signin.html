<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign-in file</title>
    <link rel="stylesheet" href="../signin/signin.css">
</head>
<body>
    <div id="main-div">
        <div id="header">
            <h1 id="h1">Sign-In</h1>
        </div>
        <form id="form">
            <label for="email" class="form-label">Email:</label>
            <input type="email" class="form-control" id="email" name="email" required>
            <label for="password" class="form-label">Password:</label>
            <input type="password" class="form-control" id="password" name="password" required>
            <div id="submit-btn">
                <button type="submit" id="submit">Submit</button>
            </div>
            <div class="signin-link">
                <p><a href="../forgotPassword/forgot.html">Forgot Password?</a></p>
                <p>New User? <a href="../signup/signup.html">Sign Up Here</a></p>

            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script src="../signin/signin.js"></script>
</body>
</html>
