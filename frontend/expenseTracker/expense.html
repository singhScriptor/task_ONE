<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../expenseTracker/expense.css">

</head>

<body>

    <header id="main-header">
        <div class="header-left">
            <h1>Track Your Expenses</h1>
        </div>
        <div class="header-right">
            <button type="button" id="premiumBtn"><i class="fa-solid fa-crown"></i> Subscribe</button>
        </div>
    </header>
    <div class="main-wrapper">
        <div class="left-column">
            <div class="summary">
                <!-- put summary content here -->
                <p>Total Summary goes here...</p>
            </div>


            <div class="left-panel">
                <nav class="tab-bar">
                    <button class="tab-btn active" data-tab="expenses">Expense Details</button>
                    <button class="tab-btn" data-tab="leaderboard">Leaderboard</button>
                    <button class="tab-btn" data-tab="graphs">Graphs</button>
                    <button class="tab-btn" data-tab="reports">Reports</button>
                </nav>

                <main id="tab-content">
                    <section id="expenses" class="tab-section active">
                        <table>
                            <thead>
                                <tr>
                                    <th>Amount</th>
                                    <th>Description</th>
                                    <th>Category</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="expense-table">

                            </tbody>
                        </table>
                    </section>
                    <section id="leaderboard" class="tab-section">
                        <h3><i class="fa-solid fa-crown"></i> Leaderboard</h3>
                        <p id="leaderboard-default">For leaderboard you have to subscribe first.</p>
                    </section>
                    <section id="graphs" class="tab-section">
                        <h3><i class="fa-solid fa-crown"></i> Graphs</h3>
                        <p id="graphs-default">For graphs you have to subscribe first.</p>
                    </section>
                    <section id="reports" class="tab-section">
                        <h3><i class="fa-solid fa-crown"></i> Report</h3>
                        <p id="report-default">For report you have to subscribe first.</p>

                        <!-- Sub-switcher Toggle Buttons -->
                        <div class="header-switcher" id="report-switcher">
                            <button class="active-header" data-report="daily">Daily</button>
                            <button data-report="monthly">Monthly</button>
                            <button data-report="yearly">Yearly</button>
                        </div>

                        <table>
                            <thead>
                                <tr>
                                    <th>Period</th>
                                    <th>Income</th>
                                    <th>Expense</th>
                                    <th>Saving</th>
                                </tr>
                            </thead>
                            <tbody id="report-table"></tbody>
                        </table>

                        <!-- download button -->
                        <button id="downloadReportBtn" style="display: none;" disabled title="Download Expenses File">
                            <i class="fa-solid fa-download"></i>
                        </button>
                    </section>
                </main>
            </div>
        </div>

        <div class="right-column">
            <div class="stats-container">
                <div class="stat-top">
                    Budget: <span id="budget"></span>
                </div>
                <div class="stat-bottom">
                    <div>Expenses: <span id="expense"></span></div>
                    <div>Balance: <span id="balance"></span></div>
                </div>
            </div>
            <div class="right-panel">

                <div class="header-switcher">
                    <button id="expenseHeader" class="active-header" onclick="showSection('expense')">
                        Add Expense
                    </button>
                    <button id="budgetHeader" onclick="showSection('budget')">
                        Add Budget
                    </button>
                </div>
                <form id="form">
                    <label for="amount">Amount</label>
                    <input type="number" class="form-control" id="price" required>
                    <label for="description">Description</label>
                    <textarea class="form-control" id="description" required></textarea>
                    <label for="category">Category</label>
                    <select class="form-control" id="category" required>

                        <option value="food">Food</option>
                        <option value="travel">Travel</option>
                        <option value="shopping">Shopping</option>
                        <option value="bills">Bills</option>
                        <option value="salary">Salary</option>
                        <option value="petrol">Petrol</option>
                        <option value="Other">Other</option>
                    </select>
                    <button type="submit" id="submit" class="form-control">Add Expense</button>
                </form>

                <!-- The New Budget Form -->
                <form id="budgetForm" style="display:none;">
                    <label for="budgetInput">Budget-Amount:</label>
                    <input type="number" class="form-control" id="budgetInput" required>
                    <button type="button" id="saveBudgetBtn" class="form-control">Save Budget</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script src="../expenseTracker/tabsSlides.js" defer></script>
    <script src="../expenseTracker/expense.js" defer></script>
    <script src="../expenseTracker/toggleform.js" defer></script>

    <script src="../expenseTracker/payment.js" defer></script>
    <script src="../expenseTracker/reportTabs.js" defer></script>

</body>

</html>
